spring.application.name=Gestor_Contable
# Base de datos: se toma de variables de entorno, con valores por defecto para desarrollo local
spring.datasource.url=jdbc:mysql://localhost:3306/Gestor_Contable?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:gestor_contable}


# Correo: credenciales SIEMPRE desde variables de entorno (nunca hardcodeadas)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1wYXJhLWRlc2Fycm9sbG8tbG9jYWwtMTIzNDU2Nzg=}
jwt.expiration=${JWT_EXPIRATION:86400000}


ia.api.key=${ANTHROPIC_API_KEY:}
ia.api.url=${IA_API_URL:https://api.anthropic.com/v1/messages}
ia.api.model=${IA_API_MODEL:claude-sonnet-5}