spring.application.name=Gestor_Contable
# Base de datos: se toma de variables de entorno, con valores por defecto para desarrollo local
spring.datasource.url=jdbc:mysql://localhost:3306/Gestor_Contable?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Correo: credenciales SIEMPRE desde variables de entorno (nunca hardcodeadas)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true