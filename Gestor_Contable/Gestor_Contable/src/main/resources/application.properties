spring.application.name=Gestor_Contable
# Base de datos: se toma de variables de entorno, con valores por defecto para desarrollo local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Gestor_Contable?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:test}


# Correo: credenciales SIEMPRE desde variables de entorno (nunca hardcodeadas)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1wYXJhLWRlc2Fycm9sbG8tbG9jYWwtMTIzNDU2Nzg=}
jwt.expiration=${JWT_EXPIRATION:86400000}


ia.api.key=${GEMINI_API_KEY:}
ia.api.url=${IA_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
ia.api.model=${IA_API_MODEL:gemini-3.6-flash}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

cors.origins=${CORS_ORIGINS:http://localhost:4200}